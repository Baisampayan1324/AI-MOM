services:
  - type: web
    name: ai-mom-backend
    runtime: python
    rootDir: backend
    pythonVersion: 3.11
    packages:
      - ffmpeg
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production